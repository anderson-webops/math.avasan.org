map $uri $math_robots_tag {
	default "";
	/admin "noindex, nofollow, noarchive";
	/admin/ "noindex, nofollow, noarchive";
}

map $uri $math_cache_control {
	default "";
	/release.json "no-store";
}

server {
	listen 8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	access_log off;
	server_tokens off;

	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header X-Robots-Tag $math_robots_tag always;
	add_header Cache-Control $math_cache_control always;

	location = /site.webmanifest {
		default_type application/manifest+json;
		try_files $uri =404;
	}

	location = /release.json {
		default_type application/json;
		try_files $uri =404;
	}

	location = /admin {
		return 302 https://cs.avasan.org/admin;
	}

	location = /admin/ {
		return 302 https://cs.avasan.org/admin;
	}

	location = /api/classroom-usage {
		# The build copies exactly one reviewed include here. A release with
		# aggregate usage disabled returns 404 and contains no proxy directive.
		include /etc/nginx/conf.d/classroom-usage.inc;
	}

	location = /api {
		return 404;
	}

	location ^~ /api/ {
		return 404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
