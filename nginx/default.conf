server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;

	location = /site.webmanifest {
		default_type application/manifest+json;
		try_files $uri =404;
	}

	location = /admin {
		return 302 https://cs.avasan.org/admin;
	}

	location = /api/classroom-usage {
		if ($request_method != POST) {
			return 405;
		}

		access_log off;
		proxy_pass https://cs.avasan.org/api/classroom-usage;
		proxy_ssl_server_name on;
		proxy_set_header Host cs.avasan.org;
		proxy_set_header Authorization "";
		proxy_set_header Cookie "";
		proxy_hide_header Set-Cookie;
		proxy_pass_request_body on;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
