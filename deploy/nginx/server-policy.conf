root /srv/math.avasan.org/current/front-end/dist;
index index.html;
access_log off;
server_tokens off;
error_page 404 /404.html;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-Robots-Tag $math_robots_tag always;
add_header Cache-Control $math_cache_control always;

location = /site.webmanifest {
	default_type application/manifest+json;
	try_files $uri =404;
}

location = /release.json {
	default_type application/json;
	try_files $uri =404;
}

location = /404.html {
	internal;
	try_files $uri =404;
}

location = /admin {
	return 302 https://cs.avasan.org/admin;
}

location = /admin/ {
	return 302 https://cs.avasan.org/admin;
}

location = /api/classroom-usage {
	include /etc/nginx/snippets/math.avasan.org-classroom-usage.inc;
}

location = /api {
	return 404;
}

location ^~ /api/ {
	return 404;
}

location / {
	if ($math_legacy_artifact_request) {
		return 404;
	}
	try_files $uri $uri/ =404;
}
