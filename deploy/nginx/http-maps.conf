map $uri $math_robots_tag {
	default "";
	/admin "noindex, nofollow, noarchive";
	/admin/ "noindex, nofollow, noarchive";
}

map $uri $math_cache_control {
	default "";
	/release.json "no-store";
	/admin "no-store";
	/admin/ "no-store";
}

map $request_uri $math_legacy_artifact_request {
	default 0;
	~^/(?:index\.html|404(?:/|/index\.html)?|(?:admin|courses|graph-sketcher)(?:\.html|/index\.html))(?:\?.*)?$ 1;
}
