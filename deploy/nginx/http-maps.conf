map $uri $math_admin_request {
	default 0;
	/admin 1;
	/admin/ 1;
	/admin.html 1;
	/admin/index.html 1;
}

map $math_admin_request $math_robots_tag {
	default "";
	1 "noindex, nofollow, noarchive";
}

map "$uri:$math_admin_request" $math_cache_control {
	default "";
	/release.json:0 "no-store";
	~:1$ "no-store";
}

map $uri $math_legacy_artifact_request {
	default 0;
	~^/(?:index\.html|404(?:/|/index\.html)?|(?:admin|courses|graph-sketcher)(?:\.html|/index\.html))(?:\?.*)?$ 1;
}
