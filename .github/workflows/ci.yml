name: CI

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

env:
    NODE_VERSION: 24.18.1
    NPM_VERSION: 12.0.2
    PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Lint
              run: npm run lint

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Typecheck
              run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [24.18.1]
                os: [ubuntu-latest]
            fail-fast: false

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix['node-version'] }}
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Unit tests
              env:
                  VITEST_WATCH: "false"
              run: |
                  ulimit -n 4096 || true
                  npm run -w front-end test:unit

    accessibility:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Axe accessibility smoke checks
              run: npm run a11y

    static-media:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Test static media request retries
              run: npm run test:static-media-request

            - name: Audit static course media
              run: npm run audit:static-media

    test-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Build front-end
              run: npm run -w front-end build

            - name: Cypress
              uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
              with:
                  install: false
                  working-directory: front-end
                  config-file: cypress.config.ts
                  start: npm run preview -- --port 3333
                  wait-on: "http://localhost:3333"

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Full dependency audit
              run: npm run audit

            - name: Production dependency audit
              run: npm run audit:production

            - name: Verify registry signatures
              run: npm run audit:signatures

            - name: Verify dependency tree
              run: npm run verify:dependency-graph

            - name: Verify native lockfile coverage
              run: npm run verify:native-lock

            - name: Simulate Linux ARM64 installs
              run: npm run verify:platform-install

            - name: Build
              run: npm run build

    native-arm64:
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Install ARM64 dependencies
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Verify native lockfile coverage
              run: npm run verify:native-lock

            - name: Build on ARM64
              run: npm run build

    native-static-runtime:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Install dependencies
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Build the native static release
              env:
                  SOURCE_REVISION: ${{ github.sha }}
              run: npm run build

            - name: Verify native deployment contracts
              run: |
                  test ! -e Dockerfile
                  test ! -e .dockerignore
                  test ! -e .github/workflows/release-container.yml
                  test -f front-end/dist/index.html
                  test -f front-end/dist/404.html
                  test -f front-end/dist/release.json
                  grep -Fq '"revision": "${{ github.sha }}"' front-end/dist/release.json
                  grep -Fq '"classroomUsageEnabled": false' front-end/dist/release.json
                  bash -n deploy/direct/prepare-static-release.sh
                  bash -n deploy/direct/promote-static-release.sh
                  bash -n deploy/direct/verify-release-source.sh
                  bash -n deploy/direct/verify-nginx-snippet-dump.sh
                  test -x deploy/direct/verify-release-source.sh
                  test -x deploy/direct/verify-nginx-snippet-dump.sh
                  test ! -e front-end/dist/.vite
                  test ! -e front-end/dist/404/index.html
                  test ! -e front-end/dist/admin.html
                  test ! -e front-end/dist/courses.html
                  test ! -e front-end/dist/graph-sketcher.html
                  grep -Fq '<loc>https://math.avasan.org/courses/</loc>' front-end/dist/sitemap.xml
                  ! grep -Fq '<loc>https://math.avasan.org/404</loc>' front-end/dist/sitemap.xml
