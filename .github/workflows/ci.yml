name: CI

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

env:
    NODE_VERSION: 24.18.1
    NPM_VERSION: 12.0.2
    PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Lint
              run: npm run lint

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Typecheck
              run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [24.18.1]
                os: [ubuntu-latest]
            fail-fast: false

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix['node-version'] }}
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Unit tests
              env:
                  VITEST_WATCH: "false"
              run: |
                  ulimit -n 4096 || true
                  npm run -w front-end test:unit

    accessibility:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Axe accessibility smoke checks
              run: npm run a11y

    static-media:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Audit static course media
              run: npm run audit:static-media

    test-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Build front-end
              run: npm run -w front-end build

            - name: Cypress
              uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
              with:
                  install: false
                  working-directory: front-end
                  config-file: cypress.config.ts
                  start: npm run preview -- --port 3333
                  wait-on: "http://localhost:3333"

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Verify pinned toolchain
              run: |
                  test "$(node --version)" = "v${NODE_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"

            - name: Install deps
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Full dependency audit
              run: npm run audit

            - name: Production dependency audit
              run: npm run audit:production

            - name: Verify registry signatures
              run: npm run audit:signatures

            - name: Verify dependency tree
              run: npm run verify:dependency-graph

            - name: Verify native lockfile coverage
              run: npm run verify:native-lock

            - name: Simulate Linux ARM64 installs
              run: npm run verify:platform-install

            - name: Build
              run: npm run build

    native-arm64:
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Use the repository npm version
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Install ARM64 dependencies
              run: npm ci --include=optional --strict-allow-scripts
              env:
                  CYPRESS_INSTALL_BINARY: "0"

            - name: Verify native lockfile coverage
              run: npm run verify:native-lock

            - name: Build on ARM64
              run: npm run build

    container:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Build pinned production image
              run: |
                  MATH_RELEASE_VERSION="$(
                    node -p "require('./package.json').version"
                  )"
                  docker build \
                    --build-arg MATH_RELEASE_VERSION="${MATH_RELEASE_VERSION}" \
                    --build-arg SOURCE_REVISION=0000000000000000000000000000000000000000 \
                    --build-arg SOURCE_DATE_EPOCH=0 \
                    --tag math-avasan:test \
                    .

            - name: Exercise read-only production image
              run: |
                  test "$(docker run --rm --entrypoint id math-avasan:test -u)" != "0"

                  docker run --rm -d \
                    --name math-avasan-test \
                    --publish 127.0.0.1:8080:8080 \
                    --read-only \
                    --tmpfs /tmp:rw,noexec,nosuid,size=32m \
                    --cap-drop ALL \
                    --security-opt no-new-privileges \
                    math-avasan:test
                  trap 'docker stop math-avasan-test' EXIT

                  for attempt in $(seq 1 20); do
                    if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
                      break
                    fi
                    if [ "$attempt" -eq 20 ]; then
                      exit 1
                    fi
                    sleep 1
                  done

                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/)" = "200"
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api)" = "404"
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/not-public)" = "404"
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/classroom-usage)" = "404"
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --data '{}' http://127.0.0.1:8080/api/classroom-usage)" = "404"
                  curl --fail --silent --show-error http://127.0.0.1:8080/release.json |
                    grep -Fq '"revision": "0000000000000000000000000000000000000000"'
                  curl --fail --silent --show-error http://127.0.0.1:8080/release.json |
                    grep -Fq '"classroomUsageEnabled": false'

            - name: Validate the dormant enabled proxy configuration
              run: |
                  docker run --rm \
                    --volume "${GITHUB_WORKSPACE}/nginx/classroom-usage-enabled.inc:/etc/nginx/conf.d/classroom-usage.inc:ro" \
                    --entrypoint nginx \
                    math-avasan:test \
                    -t
                  docker run --rm -d \
                    --name math-avasan-proxy-enabled-test \
                    --publish 127.0.0.1:8081:8080 \
                    --volume "${GITHUB_WORKSPACE}/nginx/classroom-usage-enabled.inc:/etc/nginx/conf.d/classroom-usage.inc:ro" \
                    --read-only \
                    --tmpfs /tmp:rw,noexec,nosuid,size=32m \
                    --cap-drop ALL \
                    --security-opt no-new-privileges \
                    math-avasan:test
                  trap 'docker stop math-avasan-proxy-enabled-test' EXIT

                  for attempt in $(seq 1 20); do
                    if curl --fail --silent --show-error http://127.0.0.1:8081/ >/dev/null; then
                      break
                    fi
                    if [ "$attempt" -eq 20 ]; then
                      exit 1
                    fi
                    sleep 1
                  done

                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/api/classroom-usage)" = "405"
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --header 'Origin: https://math.avasan.org' --data '{}' http://127.0.0.1:8081/api/classroom-usage)" = "403"
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --header 'Origin: https://math.avasan.org' --header 'X-Classroom-Request: 1' --data '{}' http://127.0.0.1:8081/api/classroom-usage)" = "403"
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --header 'Origin: https://math.avasan.org' --header 'Sec-Fetch-Site: same-site' --header 'X-Classroom-Request: 1' --data '{}' http://127.0.0.1:8081/api/classroom-usage)" = "403"
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --header 'Origin: https://example.invalid' --header 'Sec-Fetch-Site: cross-site' --header 'X-Classroom-Request: 1' --data '{}' http://127.0.0.1:8081/api/classroom-usage)" = "403"
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Origin: https://math.avasan.org' --header 'Sec-Fetch-Site: same-origin' --header 'X-Classroom-Request: 1' --data '{}' http://127.0.0.1:8081/api/classroom-usage)" = "415"
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --header 'Origin: https://math.avasan.org' --header 'Sec-Fetch-Site: same-origin' --header 'X-Classroom-Request: 1' --data '{}' 'http://127.0.0.1:8081/api/classroom-usage?student=1')" = "400"
                  curl --fail --silent --show-error http://127.0.0.1:8081/release.json |
                    grep -Fq '"classroomUsageEnabled": false'
