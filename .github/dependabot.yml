version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
          timezone: America/New_York
      open-pull-requests-limit: 5
      ignore:
          - dependency-name: typescript
            update-types:
                - version-update:semver-major
          # Keep deploy-target native packages on the verified native-lock workflow.
          - dependency-name: "@esbuild/linux-*"
          - dependency-name: "@oxc-parser/binding-linux-*"
          - dependency-name: "@oxc-resolver/binding-linux-*"
          - dependency-name: "@oxfmt/binding-linux-*"
          - dependency-name: "@rolldown/binding-linux-*"
          - dependency-name: "lightningcss-linux-*"
      groups:
          npm-development:
              dependency-type: development
              update-types:
                  - minor
                  - patch
          npm-production:
              dependency-type: production
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "09:15"
          timezone: America/New_York
      open-pull-requests-limit: 3
      groups:
          actions:
              patterns:
                  - "*"

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "09:30"
          timezone: America/New_York
      open-pull-requests-limit: 3
